name: Rockstar HQ feed

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      backfill:
        description: "First run only: also post the newest N items per source (0 = start silently)"
        default: "0"

permissions:
  contents: write            # lets the job save state.json and recent.json (what has been posted)

concurrency:
  group: rockstar-hq
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Rockstar and post anything new
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # optional: adds an AI TL;DR under newswire posts
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 rockstar_hq_poster.py --backfill "${{ github.event.inputs.backfill || '0' }}"

      - name: Save what has been posted
        if: always()
        run: |
          git config user.name "rockstar-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f recent.json ]; then git add recent.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update state"
            git push
          fi
